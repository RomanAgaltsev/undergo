version: '3'

vars:
  PKGS: ./cmd/... ./internal/...

  # The race detector needs cgo, so a checkout with no C toolchain cannot run
  # the gate natively. The container is the way round it, and it is also the
  # platform CI runs on. `go run ./cmd/undergo doctor` reports which of these
  # this machine can do.
  #
  # Never ./... here either: the repo root holds a package per task, and the
  # predict ones fail without a prediction.yaml. Tasks are raced through
  # `ci-verify --race`, which supplies each one its own. (This comment used to
  # quote a count. It was right at M6 and wrong for ten milestones after, which
  # is what a number in prose with nothing checking it does.)
  GO_IMAGE: "golang:1.27"
  DOCKER_RUN: >-
    docker run --rm
    -v "{{.ROOT_DIR | replace "\\" "/"}}:/src"
    -v undergo-race-modcache:/go/pkg/mod
    -v undergo-race-buildcache:/root/.cache/go-build
    -w /src {{.GO_IMAGE}}

tasks:
  build:
    desc: Build the undergo CLI into ./bin
    cmds:
      - go build -o bin/undergo ./cmd/undergo

  test:
    desc: Unit-test the machinery (never the tasks themselves)
    cmds:
      # Shuffled, because a test-order dependency and a data race fail the same
      # way at 3am and only one of them needs cgo to find.
      - go test -shuffle=on {{.PKGS}}

  lint:
    desc: golangci-lint v2
    cmds:
      - golangci-lint run

  ci:
    desc: Every gate CI runs except gate 6, the race detector — that needs cgo (see `task race`)
    cmds:
      - task: test
      - task: lint
      - task: stubs
      - task: validate
      - task: radar
      - task: seals

  race:
    desc: Gate 6 — the machinery and every reference solution, under the race detector
    cmds:
      - go test -race -shuffle=on {{.PKGS}}
      - go run ./cmd/undergo ci-verify --race

  race:docker:
    desc: The race gate in a Linux container (no local C toolchain needed)
    cmds:
      - "{{.DOCKER_RUN}} go test -race -shuffle=on {{.PKGS}}"
      - "{{.DOCKER_RUN}} go run ./cmd/undergo ci-verify --race"

  test:docker:
    desc: Race-free unit tests in the container, for comparing against the native run
    cmds:
      - "{{.DOCKER_RUN}} go test -shuffle=on {{.PKGS}}"

  test:norace:
    desc: Shuffled unit tests WITHOUT the race detector — a partial gate
    cmds:
      - echo "WARNING -- running without -race. This does NOT satisfy the race gate."
      - go test -shuffle=on {{.PKGS}}

  vuln:
    desc: govulncheck over the machinery — INDICATIVE only, CI is authoritative
    cmds:
      # Deliberately not part of `task ci`. govulncheck reports against the
      # toolchain it runs under, so a machine whose Go is newer than go.mod's
      # directive is blind to exactly the toolchain-pin advisories this exists to
      # catch — and would report a cheerful all-clear while CI, running the
      # pinned toolchain everybody else gets, goes red.
      # Same pinned version and same patterns as ci.yml, so the only difference
      # between this and the authoritative run is the toolchain.
      - echo "NOTE -- this reports against YOUR toolchain. The ci.yml job runs the pinned one."
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./cmd/... ./internal/...

  stubs:
    desc: Gate 1 — every task builds; machine-graded tasks also vet clean
    cmds:
      - go run ./cmd/undergo ci-stubs

  seals:
    desc: Gate 2 — every sealed reference solution compiles and passes, as CI runs it
    cmds:
      # --require-toolchains matches CI. Without it the seven versions tasks
      # SKIP locally when a toolchain is not cached and FAIL in CI, so a green
      # local run would mean nothing for exactly the tasks most likely to break.
      - go run ./cmd/undergo ci-verify --require-toolchains

  validate:
    desc: Gate 3 — every task manifest is valid
    cmds:
      - go run ./cmd/undergo validate

  radar:
    desc: The release radar parses and every reference resolves
    cmds:
      - go run ./cmd/undergo radar-check

  new:
    desc: Scaffold a task, e.g. task new -- --id alloc/01-x --mode build --title "X"
    cmds:
      - go run ./cmd/undergo new {{.CLI_ARGS}}

  seal:
    desc: Seal a task's _solution/, e.g. task seal -- alloc/01-x
    cmds:
      - go run ./cmd/undergo seal {{.CLI_ARGS}}
