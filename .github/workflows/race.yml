name: race

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  race:
    # The `main` ruleset requires this check by its exact name, and a matrix
    # would append the matrix value to it — silently disarming the requirement.
    # So amd64 keeps this name and arm64 is a separate job below.
    name: Gate 6 — the race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # The machinery. Shuffled as well as raced, because a test-order
      # dependency and a data race fail the same way at 3am.
      - run: go test -race -shuffle=on ./cmd/... ./internal/...

      # Every reference solution, each in its own work directory with its own
      # prediction.yaml. ci-verify captures all output and prints only a
      # verdict per task, so a solution never reaches this public log —
      # including when the race detector has something to say about it.
      #
      # The cost of that secrecy: a race here reports which task failed and
      # nothing else. Reproduce it locally with
      # `go run ./cmd/undergo start <id>`, overlay the solution, and
      # `go test -race .` — or `task race:docker` for the whole gate.
      - run: go run ./cmd/undergo ci-verify --race

  # Every reference solution was proven on two architectures and raced on one.
  # That is the easy half: amd64 is total-store-order, and the memmodel, sched
  # and concurrency tracks exist because weakly-ordered hardware disagrees with
  # it. macOS caught memmodel/02 tearing on amd64 and not on arm64 — a two-word
  # struct is two MOVQs there and a single STP here — and that was gate 2
  # noticing, with the detector never run on the architecture in question.
  race-arm64:
    name: Gate 6 — the race detector (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: go test -race -shuffle=on ./cmd/... ./internal/...
      - run: go run ./cmd/undergo ci-verify --race
