version: 2

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Terminal output is the CLI's whole job and a failed write to a closed
      # stdout is not actionable; every other error return stays checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    paths:
      - work
      - _solution
      - vendor

formatters:
  enable:
    - gofumpt
    - goimports
