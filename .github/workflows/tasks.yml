name: tasks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  seals:
    name: Gate 2 — every reference solution is proven
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      # Reference solutions must never reach a public log: ci-verify captures
      # all test output and prints only a verdict per task.
      # Toolchain-pair tasks fetch an old toolchain. In CI they must be proven,
      # not skipped: a silent skip would mean they are never checked again and
      # nobody is told.
      - run: go run ./cmd/undergo ci-verify --require-toolchains
