name: release

on:
  push: { branches: [main] }

permissions:
  contents: write
  pull-requests: write

# Two pushes to main in quick succession — a PR merge followed by a docs commit,
# which is how several milestones here have shipped — would otherwise start two
# runs that read and write the same release PR and the same manifest. Queued
# rather than cancelled: a half-finished release run should complete.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # release-please keeps a release PR open, accumulating Conventional Commits
  # since the last tag. Merging that PR creates the tag, so cutting a release is
  # a deliberate merge rather than a side effect of a push.
  #
  # No binaries are published: undergo is used by cloning it and running
  # `go run ./cmd/undergo`, so a release is the tag and the changelog.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The one action in this repository pinned by digest rather than by major
      # tag, and the only one that needs to be: every other workflow runs a
      # third-party action with contents: read, while this one hands one
      # contents: write and pull-requests: write on a public repository. A major
      # tag is mutable, so whoever controls it controls what runs here.
      #
      # Everywhere else the tag stays, because consistency across this family of
      # repositories is worth more than hardening an action that can only read.
      # Renovate updates the digest and keeps the trailing comment current.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
