schema: 1
id: concurrency/05-pool-clearing
title: "How many collections a pooled object survives"
mode: predict
track: concurrency
difficulty: 4
estimate: 40m
tags: [concurrency, sync, pool, gc, victim-cache, go1.13]
requires:
  # The race detector perturbs the victim cache: survives_one_gc measured
  # false 1 run in 8 under -race, and 12/12 true without it. No data race
  # exists — Measure runs on one goroutine at GOMAXPROCS=1 and the detector
  # reports none. This is reason 1: a runtime behaviour -race changes.
  default_build: true
predict:
  slots:
    [
      new_calls_before_any_gc,
      survives_one_gc,
      survives_two_gc,
      new_calls_after_two_gc,
    ]
inspired_by: "go-concurrency kata 10 Q1; radar candidate Go 1.13 (sync.Pool victim cache)"
